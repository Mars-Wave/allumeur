        let shelfUnit = null, shelfCols = null;
        const isAsleep = n => n.status === 'down' || n.status === 'confirming_down';
        function renderServices(silent = false) {
            if (modeAnimating) { deferredRender.services = true; return; }
            const list = document.getElementById('services-list');
            const services = lastServices || [];
            if (!services.length) { list.innerHTML = '<div class="loading carded">No services configured yet.</div>'; tallyServices(); castShadows(); return; }
            // Grouping is exact string equality: a service belongs to the node whose
            // ip field matches its address as stored (fqdn or ip alike); everything
            // else stands alone on the shelf at its own seat.
            const byIp = new Map((lastNodes || []).map(n => [n.ip, n]));
            const groups = new Map(); const blocks = [];
            services.forEach((s, idx) => {
                const n = byIp.get(s.ip);
                if (!n) { blocks.push({ order: s.order, name: s.name, s, idx }); return; }
                if (!groups.has(n.ip)) { const g = { order: n.order, name: n.name, node: n, kids: [] }; groups.set(n.ip, g); blocks.push(g); }
                groups.get(n.ip).kids.push({ s, idx });
            });
            blocks.sort(byShelf); // groups sit at their node's shelf seat, standalones at their own
            let vi = 0; // visible-only enter stagger, block by block
            const clampU = k => shelfCols ? Math.min(k, shelfCols) : k;
            // Rebuilds park the width ease (the same lever live drags pull):
            // whatever widths the fresh DOM's first layout computes must land,
            // never glide. The .45s ease stays reserved for real mode flips and
            // unit-count changes, as promised at the .host-card rule.
            const parked = document.body.classList.contains('resizing');
            if (!parked) document.body.classList.add('resizing');
            list.innerHTML = `<div class="shelf" id="shelf"${shelfUnit ? ` style="--unit:${shelfUnit}px"` : ''}>` + blocks.map(b => {
                if (!b.node) {
                    const shown = allumeurMode || b.s.favourite;
                    const enter = (silent || !shown) ? '' : ` enter" style="animation-delay:${vi++ * 55}ms`;
                    return svcCardHTML(b.s, b.idx, ' solo', enter);
                }
                const n = b.node;
                b.kids.sort((x, y) => byShelf(x.s, y.s)); // intra order: the group's own 1..k
                const kAll = b.kids.length, kFav = b.kids.filter(k => k.s.favourite).length;
                const asleep = isAsleep(n);
                const prev = hostDim[n.mac]; hostDim[n.mac] = asleep;
                const dimCls = (prev !== undefined && prev !== asleep) ? (asleep ? ' just-dimmed' : ' just-undimmed') : '';
                const entering = !silent && (allumeurMode || kFav > 0);
                const cls = `host-card${asleep ? ' asleep' : ''}${dimCls}${kFav ? '' : ' nf'}${entering ? ' enter' : ''}`;
                const style = `--hu-all:${clampU(kAll)};--hu-fav:${clampU(Math.max(kFav, 1))}${entering ? `;animation-delay:${vi++ * 55}ms` : ''}`;
                const count = k => `${k} service${k === 1 ? '' : 's'}`;
                return `
                <section class="${cls}" style="${style}" data-mac="${esc(n.mac)}" data-kall="${kAll}" data-kfav="${Math.max(kFav, 1)}" aria-label="Services on ${esc(dispName(n))}">
                    <div class="host-head">
                        <span class="dot ${esc(n.status)}" role="img" aria-label="${esc(STATUS_TEXT[n.status] || n.status)}"></span>
                        <span class="host-name">${nmSpans(n.name, n.pretty)}</span>
                        <span class="host-count"><span class="ct-all">${count(kAll)}</span><span class="ct-fav">${count(kFav)}</span></span>
                    </div>
                    <div class="host-grid">${b.kids.map(k => svcCardHTML(k.s, k.idx, '', '')).join('')}</div>
                </section>`;
            }).join('') + `</div>`;
            // Nothing on the guest's side of the curtain: say so, gently.
            if (!services.some(s => s.favourite)) list.insertAdjacentHTML('beforeend', '<div class="loading carded nf-empty">Nothing on show right now.</div>');
            relayout();
            // Commit the freshly-written widths as the resting state while the
            // ease is still parked, then hand the lever back (unless a live
            // drag owns it - its own timer will let go).
            if (!parked) { void list.offsetWidth; document.body.classList.remove('resizing'); }
            tallyServices();
            castShadows();
        }
        // ── The inside-out fill: from the shelf's width pick U, the row's unit
        // count; size the unit so a full tray row lands flush (two tray chromes
        // reserved so a tray-plus-tray row still fits); clamp every tray to
        // min(its services, U) units. All of it lands in CSS vars - the flexbox
        // and the tray grids do the actual laying-out.
        // The unit floor is set by what a unit must seat: the header's fixed
        // furniture (21px pad + 12px lamp + 12px gap + the 77px action/arrow
        // lane ≈ 122px) plus a name budget of ≈ 122px, enough to seat a
        // "Queue Series!"-length service name (and "Shiny Album! ★") unclipped
        // -> 244, so those ride whole at every column count the floor admits
        // and only a genuinely longer name takes the one-line ellipsis. Narrow
        // screens are untouched: below two columns the unit is the shelf
        // itself, exactly as before.
        const SHELF = { gap: 13, chrome: 22, umin: 244 };
        function relayout() {
            const shelf = document.getElementById('shelf');
            if (!shelf) return;
            const W = shelf.clientWidth;
            if (!W) return; // hidden tab: re-measured on its next visible render
            const U = Math.max(1, Math.floor((W - 2 * SHELF.chrome + SHELF.gap) / (SHELF.umin + SHELF.gap)));
            const u = (W - (U - 1) * SHELF.gap - 2 * SHELF.chrome) / U;
            shelfUnit = +u.toFixed(2); shelfCols = U; // remembered for the next rebuild's inline geometry
            shelf.style.setProperty('--unit', shelfUnit + 'px');
            shelf.querySelectorAll('.host-card').forEach(h => {
                h.style.setProperty('--hu-all', Math.min(+h.dataset.kall || 1, U));
                h.style.setProperty('--hu-fav', Math.min(+h.dataset.kfav || 1, U));
            });
        }
        window.__relayout = relayout;
        // Live window drags reflow instantly - a short-lived body class parks the
        // trays' width ease so nothing chases the cursor. (Registered before the
        // canvas's own resize listener, which re-aims the lamp-cast after us.)
        let resizeStill = null;
        window.addEventListener('resize', () => {
            document.body.classList.add('resizing');
            relayout();
            clearTimeout(resizeStill);
            resizeStill = setTimeout(() => document.body.classList.remove('resizing'), 180);
        });
        // Animate the body's real travel: measure scrollHeight and transition to/from it, so
        // the ease is felt across the actual distance in both directions (no fixed cap).
        function animateFold(card, open) {
            const body = card.querySelector('.fold-body'); if (!body) return;
            if (open) {
                body.style.maxHeight = body.scrollHeight + 'px';
            } else {
                body.style.maxHeight = body.scrollHeight + 'px'; // pin from 'none' to a real px start
                void body.offsetHeight; // flush so the walk back to 0 actually transitions
                body.style.maxHeight = '0px';
            }
        }
        function toggleSvc(i, btn) {
            const s = (lastServices || [])[i]; if (!s) return;
            const card = btn.closest('.card');
            const open = !card.classList.contains('open');
            svcOpen[svcKey(s)] = open;
            card.classList.toggle('open', open);
            btn.setAttribute('aria-expanded', open);
            animateFold(card, open);
        }
        // The masthead pill is expand-all / collapse-all for whichever tab is on
        // stage; each tab remembers its own. Both tabs share the one card language
        // now, so neither re-renders - every card just folds toward the new default.
        function setViewMode(mode) {
            mode = mode === 'detailed' ? 'detailed' : 'compact';
            viewMode[activeTab] = mode;
            localStorage.setItem(VIEW_KEYS[activeTab], mode);
            syncModeButtons();
            if (activeTab === 'services') svcOpen = {}; else nodeOpen = {};
            const open = mode === 'detailed';
            const root = activeTab === 'services' ? '#services-list' : '#nodes-view';
            document.querySelectorAll(root + ' .card').forEach(card => {
                const changed = card.classList.contains('open') !== open;
                card.classList.toggle('open', open);
                const b = card.querySelector('.card-toggle');
                if (b) b.setAttribute('aria-expanded', open);
                if (changed) animateFold(card, open);
            });
            // On desk widths a density flip can re-width the name-hugging cards
            // (and every fold re-heights); re-aim the lamp-cast once the .38s
            // folds have landed so no card keeps a shadow cast at its old seat.
            setTimeout(castShadows, 460);
        }
        function syncModeButtons() {
            ['compact', 'detailed'].forEach(m => {
                const b = document.getElementById('vm-' + m);
                b.classList.toggle('active', viewMode[activeTab] === m);
                b.setAttribute('aria-pressed', viewMode[activeTab] === m);
            });
            // Desk widths size a summarized node card to its name alone: the CSS
            // width-contains the fold while the tab's density is compact, and this
            // mirror is how it knows. (Runs at boot, on tab switches and on every
            // density change - the same beats the pill itself repaints on.)
            document.getElementById('nodes-view').classList.toggle('vm-compact', viewMode.nodes === 'compact');
        }

        function switchTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active-tab'));
            document.querySelectorAll('.seg-btn').forEach(b => { b.classList.remove('active'); b.setAttribute('aria-selected', 'false'); });
            document.getElementById(tab + '-tab').classList.add('active-tab');
            const btn = document.getElementById('tab-' + tab);
            btn.classList.add('active'); btn.setAttribute('aria-selected', 'true');
            document.getElementById('seg').classList.toggle('svc', tab === 'services');
            // The tally follows the stage: only the active tab's off·on pair is shown
            // (the display flip replays the little rise-in on the incoming pair).
            document.getElementById('tally-nodes').hidden = tab !== 'nodes';
            document.getElementById('tally-services').hidden = tab !== 'services';
            syncModeButtons();
            // With data already in hand, show it instantly and freshen silently in the
            // background; the loader is reserved for a genuinely empty first visit.
            if (tab === 'nodes') {
                if (lastNodes) { renderNodes(true); loadNodes(true); } else loadNodes();
            } else {
                if (lastServices) { renderServices(true); loadServices(true); } else loadServices();
            }
        }

        // ── Freshness: show how recent the data is, refresh the visible tab, offer a manual poke ──
        function markUpdated() {
            lastUpdated = Date.now(); pollFailed = false;
            // A fresh success also lets the tally counts speak plainly again.
            document.getElementById('tally').classList.remove('stale');
            renderFreshness();
        }
        function markFailed() {
            pollFailed = true;
            // Confident tally counts would contradict the retrying label beside them - dim
            // them until the next good poll.
            document.getElementById('tally').classList.add('stale');
            renderFreshness();
        }
        // The bar keeps freshness terse; the full sentence lives in the label's tooltip.
        function renderFreshness() {
            const el = document.getElementById('updated');
            if (!el) return;
            el.classList.toggle('stale', pollFailed);
            const s = lastUpdated ? Math.round((Date.now() - lastUpdated) / 1000) : null;
            const ago = s === null ? null : (s < 90 ? `${s}s ago` : `${Math.round(s / 60)}m ago`);
            if (pollFailed) {
                el.textContent = 'retrying…';
                el.title = ago ? `Couldn't reach the API - last good update ${ago}` : `Couldn't reach the API - no update yet`;
                return;
            }
            if (s === null) { el.textContent = 'updating…'; el.title = 'Waiting for the first update'; return; }
            el.textContent = s < 5 ? 'just now' : ago;
            el.title = `Data updated ${s < 5 ? 'just now' : ago}`;
        }
        function refreshActive(btn) {
            if (btn) { btn.classList.remove('spinning'); void btn.offsetWidth; btn.classList.add('spinning'); setTimeout(() => btn.classList.remove('spinning'), 700); }
            activeTab === 'nodes' ? loadNodes(true) : loadServices(true);
        }
        setInterval(renderFreshness, 1000);
        // Gentle background refresh so a settled dashboard doesn't drift stale; the faster
        // confirming re-poll owns the nodes tab while something is mid-transition.
        setInterval(() => {
            if (activeTab === 'nodes') { if (!nodesTimer) loadNodes(true); }
            else loadServices(true);
        }, 20000);

        // Once an unfold lands, relax the pinned px to 'none' so open cards reflow freely.
        // Delegated from the document so both tabs' fold bodies share it.
        document.addEventListener('transitionend', e => {
            if (e.propertyName !== 'max-height' || !(e.target instanceof Element) || !e.target.classList.contains('fold-body')) return;
            const card = e.target.closest('.card');
            if (card && card.classList.contains('open')) e.target.style.maxHeight = 'none';
        });

        syncModeButtons();
        loadNodes();
        // Warm the services tab without waiting for the first tab switch - and keep the
        // payload, so the first visit renders instantly from cache with a silent freshen.
        fetch('/api/services').then(r => r.json()).then(s => {
            lastServices = shelfSort(s);
            markUpdated();
            tallyServices();
        }).catch(() => {});

        // ─── Dusk-aware ambience: the wallpaper and the candle glow key their warmth to
        // the viewer's local hour. One cosine over the day - brightest near 13:00, warmest
        // and dimmest near 01:00 - so dusk arrives as a smooth ramp, never a jump. All of
        // it lands in CSS custom properties, recomputed once a minute (one style recalc;
        // no per-frame work). The palette stays pastel at every hour: night is warm-dim
        // lamplight, never dark mode. Reviewers can freeze the clock with ?hour=19 or
        // window.__setAmbienceHour(19); pass null to hand it back to the real clock.
        (function () {
            const root = document.documentElement.style;
            let override = null;
            const q = new URLSearchParams(location.search).get('hour');
            if (q !== null && q !== '' && isFinite(+q)) override = +q;
            const lerp = (a, b, t) => a + (b - a) * t;
            const mixHex = (a, b, t) => '#' + a.map((v, i) => Math.round(lerp(v, b[i], t)).toString(16).padStart(2, '0')).join('');
            const mixRgba = (a, b, t) => `rgba(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))},${lerp(a[3], b[3], t).toFixed(3)})`;
            // Day endpoints are the classic wallpaper; night leans warm and a touch dimmer.
            // The lamp-cast wash (top-left corner) rides the same curve: a faint sandy
            // breath at noon, a fuller pool of lamplight as the rest of the page dims.
            const DAY = { bg: [255, 245, 248], top: [255, 225, 236], c1: [179, 229, 252, .30], c2: [200, 230, 201, .28],
                          core: [251, 233, 184, .55], mid: [249, 229, 181, .30], a: .62,
                          washc: [249, 229, 181, .15], washm: [249, 229, 181, .06] };
            const NIGHT = { bg: [247, 232, 221], top: [248, 214, 189], c1: [231, 203, 213, .26], c2: [242, 216, 183, .26],
                            core: [246, 206, 138, .85], mid: [243, 203, 143, .48], a: .95,
                            washc: [246, 200, 122, .42], washm: [244, 207, 151, .19] };
            function applyAmbience() {
                const now = new Date();
                const h = override !== null ? ((override % 24) + 24) % 24 : now.getHours() + now.getMinutes() / 60;
                const t = 0.5 + 0.5 * Math.cos(Math.PI * 2 * (h - 1) / 24); // 0 = full day, 1 = full night
                root.setProperty('--bg', mixHex(DAY.bg, NIGHT.bg, t));
                root.setProperty('--amb-top', mixHex(DAY.top, NIGHT.top, t));
                root.setProperty('--amb-corner1', mixRgba(DAY.c1, NIGHT.c1, t));
                root.setProperty('--amb-corner2', mixRgba(DAY.c2, NIGHT.c2, t));
                root.setProperty('--halo-core', mixRgba(DAY.core, NIGHT.core, t));
                root.setProperty('--halo-mid', mixRgba(DAY.mid, NIGHT.mid, t));
                root.setProperty('--halo-a', lerp(DAY.a, NIGHT.a, t).toFixed(3));
                root.setProperty('--wash-core', mixRgba(DAY.washc, NIGHT.washc, t));
                root.setProperty('--wash-mid', mixRgba(DAY.washm, NIGHT.washm, t));
            }
            window.__setAmbienceHour = h => { override = (h === null || h === undefined) ? null : +h; applyAmbience(); };
            applyAmbience();
            setInterval(applyAmbience, 60000);
        })();

        // ─── Pastel polka particle system + lamplight fireflies ─────────────────
        // One canvas, one visibility-guarded rAF loop, and only calm ambience on it:
        // the slow upward dot drift, plus a handful of fireflies around the lamp's
        // halo. (The old click-burst explosions are gone on purpose - press feedback
        // now belongs to the controls' own state language and the live choreography.)
        (function () {
            const canvas = document.createElement('canvas');
            canvas.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;';
            document.body.prepend(canvas);
            const ctx = canvas.getContext('2d');
            var rafId = null;

            // A shade deeper than the wallpaper pastels so the field reads clearly on the
            // pale pink ground - still airy, never neon.
            const PASTELS = ['#f8bbd0','#f48fb1','#f8bbd0','#90caf9','#c5e1a5','#ffe082','#ce93d8','#ffcc80','#c5e2cf','#f9e5b5'];
            const dots = [];
            // Fireflies stay inside the glow family and inside the halo's reach.
            const FLY_COLORS = ['#f9e5b5', '#f2cf9f', '#f6d183', '#fdf4dc'];
            const flies = [];
            // The halo anchor is measured from the lamp mark (in document space) on
            // load/resize only - no per-frame layout reads, no scroll listener. The
            // fixed canvas re-aims each painted frame with a cheap window.scrollY read
            // (below, inside the guarded rAF loop), so the fireflies stay nestled at
            // the lamp's halo when the page scrolls.
            const anchor = { x: 80, y: 70 };
            var scrollOfs = 0;
            function refreshAnchor() {
                const m = document.querySelector('.brand-mark');
                if (!m) return;
                const b = m.getBoundingClientRect();
                anchor.x = b.left + b.width / 2; anchor.y = b.top + b.height / 2 + window.scrollY;
            }

            function resize() {
                canvas.width = innerWidth; canvas.height = innerHeight;
                refreshAnchor();
                // The lamp-cast card shadows are aimed from the same anchor and go
                // stale in exactly the same reflows, so re-aim them on this ride.
                if (window.__castShadows) window.__castShadows();
                // Setting the canvas size wipes it; when the loop is parked (reduced
                // motion or a hidden tab) repaint once so the still sprinkle survives.
                if (rafId === null) paint();
            }
            window.addEventListener('resize', resize);

            function rnd(a, b) { return Math.random() * (b - a) + a; }
            function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

            function Dot() {}
            Dot.prototype.init = function (x, y) {
                this.color = pick(PASTELS);
                this.r = rnd(2, 6);
                this.x = (x !== undefined) ? x : rnd(0, canvas.width);
                this.y = (y !== undefined) ? y : rnd(canvas.height * 0.1, canvas.height * 1.1);
                this.vx = rnd(-0.25, 0.25); this.vy = rnd(-0.4, -0.1);
                this.alpha = rnd(0.5, 0.9); this.decay = rnd(0.0003, 0.0008);
                return this;
            };
            Dot.prototype.step = function () {
                this.x += this.vx; this.y += this.vy; this.alpha -= this.decay;
                if (this.x < -20) this.x = canvas.width + 20;
                if (this.x > canvas.width + 20) this.x = -20;
                if (this.alpha <= 0 || this.y < -20) this.init(rnd(0, canvas.width), canvas.height + 10);
            };
            Dot.prototype.draw = function () {
                ctx.save(); ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color; ctx.beginPath();
                ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            };

            // A firefly wanders a slow ellipse around the halo, easing its orbit in and
            // out while it twinkles - six of them, two arcs each, effectively free next
            // to the ninety drift dots already on this canvas.
            function Fly() {
                this.a = Math.random() * Math.PI * 2;                       // position on the orbit
                this.d = rnd(26, 128);                                      // orbit radius (px)
                this.va = rnd(0.0012, 0.0034) * (Math.random() < .5 ? -1 : 1);
                this.dd = rnd(-0.06, 0.06);                                 // orbit breathing
                this.tw = Math.random() * Math.PI * 2;                      // twinkle phase
                this.ts = rnd(0.006, 0.016);
                this.r = rnd(1.3, 2.4);
                this.color = pick(FLY_COLORS);
            }
            Fly.prototype.step = function () {
                this.a += this.va; this.tw += this.ts; this.d += this.dd;
                if (this.d < 22 || this.d > 132) this.dd = -this.dd;
            };
            Fly.prototype.draw = function () {
                const x = anchor.x + Math.cos(this.a) * this.d * 1.2;
                const y = anchor.y - scrollOfs + Math.sin(this.a) * this.d * 0.85;
                const glow = 0.5 + 0.42 * Math.sin(this.tw);
                ctx.save();
                ctx.fillStyle = this.color;
                ctx.globalAlpha = glow * 0.28;                              // soft outer halo
                ctx.beginPath(); ctx.arc(x, y, this.r * 2.7, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = glow;                                     // bright core
                ctx.beginPath(); ctx.arc(x, y, this.r, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            };

            resize();
            for (var i = 0; i < 90; i++) dots.push(new Dot().init());
            for (var j = 0; j < 6; j++) flies.push(new Fly());

            function paint() {
                // One scrollY read per painted frame keeps the doc-space anchor honest
                // on the fixed canvas (also covers the parked reduced-motion repaints).
                scrollOfs = window.scrollY;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (var i = 0; i < dots.length; i++) dots[i].draw();
                for (var j = 0; j < flies.length; j++) flies[j].draw();
            }
            function frame() {
                for (var i = 0; i < dots.length; i++) dots[i].step();
                for (var j = 0; j < flies.length; j++) flies[j].step();
                paint();
            }

            function loop() { frame(); rafId = requestAnimationFrame(loop); }
            function start() { if (rafId) return; loop(); }
            function stop() { if (rafId) { cancelAnimationFrame(rafId); rafId = null; } }

            // While the rAF loop is parked (reduced motion), the lamp still scrolls with
            // the document - so repaint the still sprinkle once per scroll, throttled
            // through a one-shot rAF. Zero animation: nothing steps, the same frozen
            // fireflies simply stay seated at the halo instead of detaching from it.
            var scrollRepaint = null;
            window.addEventListener('scroll', function () {
                if (rafId !== null || scrollRepaint !== null) return; // the live loop already tracks scroll
                scrollRepaint = requestAnimationFrame(function () {
                    scrollRepaint = null;
                    if (rafId === null) paint();
                });
            }, { passive: true });

            // Respect a reduced-motion preference: paint one still sprinkle (fireflies
            // stilled too) and hold there - no drifting loop. And spend nothing on a
            // hidden tab - the rAF loop only runs while the page is actually being
            // rendered. Re-evaluate on either signal changing.
            var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
            function apply() {
                if (reduce.matches) { stop(); paint(); }
                else if (document.hidden) { stop(); }
                else { start(); }
            }
            apply();
            reduce.addEventListener ? reduce.addEventListener('change', apply) : reduce.addListener(apply);
            document.addEventListener('visibilitychange', apply);
        })();
        // ────────────────────────────────────────────────────────────────────────
    </script>
</body>
</html>
